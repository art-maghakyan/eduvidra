server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        # The AI tutor streams its reply over SSE and can hold the connection
        # open for minutes. Without this, nginx's 60s default kills the stream
        # mid-answer. Laravel's eventStream() already sends X-Accel-Buffering: no,
        # so nginx does not buffer the chunks.
        #
        # gzip is off in this image (nginx.conf ships it commented out), so
        # nothing re-buffers the stream on the way out.
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

