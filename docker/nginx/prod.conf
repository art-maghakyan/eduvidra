# ==========================================
# 1. HTTP Server Block (Redirects to HTTPS)
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name eduvidra.com www.eduvidra.com;

    # Instantly pushes traffic to the secure variant
    return 301 https://$host$request_uri;
}

# ==========================================
# 2. HTTPS Server Block (Your Optimized App)
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # ⚠️ Updated from '_' to your actual domain names
    server_name eduvidra.com www.eduvidra.com;

    # 🔒 Cloudflare SSL Keys mounted via docker-compose.prod.yml
    ssl_certificate /etc/nginx/certs/eduvidra.crt;
    ssl_certificate_key /etc/nginx/certs/eduvidra.key;

    # Secure SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Your Original Optimized Config Rules Start Here ---
    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/x-font-ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~* \.(?:css|js|mjs|map|ico|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass active_app; # Keeps your original upstream target name
        fastcgi_index index.php;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}