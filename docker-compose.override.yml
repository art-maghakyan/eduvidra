x-app-environment: &app-environment
  APP_ENV: local
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: eduvidra_db
  DB_USERNAME: dev_user
  DB_PASSWORD: dev_password
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_CLIENT: phpredis
  MAIL_MAILER: smtp
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: 587
  MAIL_ENCRYPTION: tls
  ELASTIC_HOST: elasticsearch:9200

x-app-depends-on: &app-depends-on
  - db
  - redis

services:
  app:
    build:
      target: dev
    container_name: eduvidra-app
    volumes:
      - .:/var/www
    environment: *app-environment
    depends_on: *app-depends-on

  nginx:
    image: nginx:1.27-alpine
    container_name: eduvidra-nginx
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - eduvidra-network

  queue:
    build:
      target: dev
    container_name: eduvidra-queue
    depends_on: *app-depends-on
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: php artisan horizon
    environment: *app-environment

  scheduler:
    build:
      target: dev
    container_name: eduvidra-scheduler
    depends_on: *app-depends-on
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: php artisan schedule:work
    environment: *app-environment

  redis:
    container_name: eduvidra-redis

  db:
    image: postgres:17-alpine
    container_name: eduvidra-db
    environment:
      POSTGRES_DB: eduvidra_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - eduvidra-network
    ports:
      - "5432:5432"

  vite:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: eduvidra-vite
    depends_on:
      - app
    volumes:
      - .:/var/www
      - vite_node_modules:/var/www/node_modules
    working_dir: /var/www
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    networks:
      - eduvidra-network

  elasticsearch:
    image: elasticsearch:9.0.3
    container_name: eduvidra-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - eduvidra-network

volumes:
  pgdata:
  vite_node_modules:
  esdata:
