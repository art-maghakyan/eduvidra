x-awslogs-options: &awslogs-options
  awslogs-region: ${AWS_DEFAULT_REGION:-eu-central-1}
  awslogs-create-group: "true"

services:
  app:
    image: eduvidra-app:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/storage
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /eduvidra/prod/app
        awslogs-stream-prefix: app

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-dev}
    image: eduvidra-nginx:latest
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    networks:
      - eduvidra-network
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /eduvidra/prod/nginx
        awslogs-stream-prefix: nginx

  queue:
    image: eduvidra-app:latest
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
    volumes:
      - app_storage:/var/www/storage
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /eduvidra/prod/queue
        awslogs-stream-prefix: queue

  scheduler:
    image: eduvidra-app:latest
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - app_storage:/var/www/storage
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /eduvidra/prod/scheduler
        awslogs-stream-prefix: scheduler

  redis:
    restart: unless-stopped
    volumes:
      - redis_data:/data
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /eduvidra/prod/redis
        awslogs-stream-prefix: redis

volumes:
  app_storage:
  redis_data:
