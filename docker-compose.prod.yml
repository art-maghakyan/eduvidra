x-awslogs-options: &awslogs-options
  awslogs-region: ${AWS_DEFAULT_REGION:-eu-central-1}
  awslogs-create-group: "true"

x-prod-app: &prod-app
  build:
    context: .
    dockerfile: Dockerfile
    target: app
    args:
      VITE_APP_VERSION: ${VITE_APP_VERSION:-dev}
  image: eduvidra-app:latest
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - app_storage:/var/www/storage
  networks:
    - eduvidra-network
  logging:
    driver: awslogs
    options:
      <<: *awslogs-options
      awslogs-group: /eduvidra/prod/app

services:
  app:
    <<: *prod-app
    profiles:
      - legacy

  app-blue:
    <<: *prod-app

  app-green:
    <<: *prod-app

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-dev}
    image: eduvidra-nginx:latest
    restart: unless-stopped
    depends_on:
      - app-blue
    ports:
      - "80:80"
    volumes:
      - ./.deploy/upstream-active.conf:/etc/nginx/conf.d/upstream-active.conf:ro
    networks:
      - eduvidra-network
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /eduvidra/prod/nginx

  queue:
    image: eduvidra-app:latest
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
    volumes:
      - app_storage:/var/www/storage
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /eduvidra/prod/queue

  scheduler:
    image: eduvidra-app:latest
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - app_storage:/var/www/storage
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /eduvidra/prod/scheduler

  redis:
    restart: unless-stopped
    volumes:
      - redis_data:/data
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /eduvidra/prod/redis

volumes:
  app_storage:
  redis_data:
