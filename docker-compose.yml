x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: app
  args:
    VITE_APP_VERSION: ${VITE_APP_VERSION:-dev}

services:
  app:
    build: *app-build
    networks:
      - eduvidra-network

  queue:
    build: *app-build
    depends_on:
      - redis
    networks:
      - eduvidra-network

  scheduler:
    build: *app-build
    depends_on:
      - redis
    networks:
      - eduvidra-network

  redis:
    image: redis:7-alpine
    networks:
      - eduvidra-network

networks:
  eduvidra-network:
    driver: bridge
