services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    networks:
      - eduvidra-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    depends_on:
      - redis
    networks:
      - eduvidra-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    depends_on:
      - redis
    networks:
      - eduvidra-network

  redis:
    image: redis:7-alpine
    networks:
      - eduvidra-network

networks:
  eduvidra-network:
    driver: bridge
