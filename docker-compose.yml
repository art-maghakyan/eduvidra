services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduvidra-app
    volumes:
      - .:/var/www
    networks:
      - eduvidra-network
    ports:
      - "8000:8000"  # This maps your Ubuntu port to the Laravel port
      - "5173:5173"  # This maps your Node.js port to the Vite port

  db:
    image: postgres:17-alpine
    container_name: eduvidra-db
    environment:
      POSTGRES_DB: eduvidra_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - eduvidra-network
    ports:
      - "5432:5432" # This maps your PostgreSQL port to the Docker port

networks:
  eduvidra-network:
    driver: bridge

volumes:
  pgdata: