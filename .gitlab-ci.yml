stages:
  - lint
  - test
  - deploy

default:
  interruptible: true

# ---------- LINT ----------
pint:
  stage: lint
  image: composer:2
  before_script:
    - composer install --no-interaction --no-progress --prefer-dist --no-scripts
  script:
    - vendor/bin/pint --test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------- TEST ----------
phpunit:
  stage: test
  image: php:8.4-cli
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git unzip libicu-dev libzip-dev libpng-dev libonig-dev libxml2-dev libsqlite3-dev
    - docker-php-ext-install -j"$(nproc)" intl zip gd mbstring bcmath pdo_sqlite
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress --prefer-dist
    - cp .env.example .env
    - php artisan key:generate
  script:
    - php artisan test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------- DEPLOY ----------
deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # Copy the key to a tmp file and guarantee a trailing newline
    # (GitLab's File-type variables sometimes strip the final newline,
    #  which breaks OpenSSH with "error in libcrypto").
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/deploy_key
    - tail -c1 ~/.ssh/deploy_key | read -r _ || echo >> ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
    - DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
    - echo "Deploying to ${DEPLOY_USER}@${DEPLOY_HOST}"
    - ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/deploy_key.pub && echo "Key parsed OK"
  script:
    - ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash /opt/eduvidra/bin/deploy.sh'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: http://63.184.58.11
