stages:
  - build
  - lint
  - test
  - deploy

# Pipelines run ONLY in these two cases:
#  - A merge request is open (validates the MR with lint + tests)
#  - A push lands on the default branch (master) to deploy
# Plain feature-branch pushes (no MR) trigger NO pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  interruptible: true

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_NO_INTERACTION: "1"
  # Keep Composer's download cache inside the project dir so GitLab can
  # persist it across runs (runners only cache paths under $CI_PROJECT_DIR).
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  # Pre-built CI image (PHP 8.4 CLI + all extensions + Composer) used by
  # the `phpunit` job. Rebuilt by `build:ci-image` when docker/ci/Dockerfile
  # changes. Stored in this project's GitLab Container Registry.
  CI_PHP_IMAGE: $CI_REGISTRY_IMAGE/ci-php:8.4

# Reusable cache for every job that runs `composer install`.
# Key on composer.lock so the cache auto-invalidates when deps change.
# Bump the `prefix` (e.g. v1 -> v2) to force a clean cache rebuild.
.composer-cache: &composer-cache
  key:
    files:
      - composer.lock
    prefix: composer-v1
  paths:
    - vendor/
    - .cache/composer/
  policy: pull-push

# ---------- BUILD: CI IMAGE ----------
# Rebuilds and pushes $CI_PHP_IMAGE only when docker/ci/Dockerfile changes.
# All other pipelines skip this job and reuse the image from the registry.
build:ci-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - changes:
        - docker/ci/Dockerfile
  before_script:
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
  script:
    - docker pull "$CI_PHP_IMAGE" || true
    - docker build --cache-from "$CI_PHP_IMAGE" -t "$CI_PHP_IMAGE" docker/ci
    - docker push "$CI_PHP_IMAGE"

# ---------- LINT ----------
pint:
  stage: lint
  image:
    name: $CI_PHP_IMAGE
    pull_policy: always
  cache:
    - <<: *composer-cache
  before_script:
    - composer install --no-progress --prefer-dist --no-scripts
  script:
    - vendor/bin/pint --test

# ---------- TEST ----------
phpunit:
  stage: test
  image:
    name: $CI_PHP_IMAGE
    pull_policy: always
  cache:
    - <<: *composer-cache
  before_script:
    - composer install --no-progress --prefer-dist
    - cp .env.example .env
    - php artisan key:generate
  script:
    - php artisan test

# ---------- DEPLOY ----------
deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # Copy the key to a tmp file and guarantee a trailing newline
    # (GitLab's File-type variables sometimes strip the final newline,
    #  which breaks OpenSSH with "error in libcrypto").
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/deploy_key
    - tail -c1 ~/.ssh/deploy_key | read -r _ || echo >> ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
    - DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
    - echo "Deploying to ${DEPLOY_USER}@${DEPLOY_HOST}"
    - ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/deploy_key.pub && echo "Key parsed OK"
  script:
    - ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash /opt/eduvidra/bin/deploy.sh'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: http://63.184.58.11
